<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pasticely — Gestión de Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="flex items-center justify-between border-b border-stone-200 pb-4 mb-8">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Pasticely</h1>
        <p class="text-sm text-stone-500">Control de pedidos y clientes</p>
      </div>
      <button id="btnLogout" onclick="cerrarSesion()" class="hidden text-sm px-3 py-1.5 rounded border border-stone-300 hover:bg-stone-100">
        Cerrar sesión
      </button>
    </header>

    <!-- Vista de Login -->
    <section id="vistaLogin" class="max-w-sm mx-auto bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
      <h2 class="text-lg font-medium mb-4">Acceso al sistema</h2>
      <form id="formLogin" class="space-y-4">
        <div>
          <label class="block text-xs text-stone-500 mb-1">Correo</label>
          <input type="email" id="loginUsuario" value="admin@pasticely.com" required class="w-full px-3 py-2 text-sm border border-stone-300 rounded-lg" />
        </div>
        <div>
          <label class="block text-xs text-stone-500 mb-1">Contraseña</label>
          <input type="password" id="loginPassword" value="pasticely123" required class="w-full px-3 py-2 text-sm border border-stone-300 rounded-lg" />
        </div>
        <button type="submit" class="w-full bg-stone-900 text-white text-sm py-2 rounded-lg hover:bg-stone-800">
          Entrar
        </button>
      </form>
    </section>

    <!-- Vista Principal -->
    <main id="vistaApp" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Formulario Nuevo Pedido -->
      <section class="bg-white p-5 rounded-xl border border-stone-200 h-fit">
        <h2 class="text-base font-medium mb-4">Nuevo pedido</h2>
        <form id="formPedido" class="space-y-3 text-sm">
          <input type="text" id="cliente_nombre" placeholder="Nombre del cliente" required class="w-full px-3 py-2 border border-stone-300 rounded-lg" />
          <input type="text" id="cliente_telefono" placeholder="Teléfono (ej. 6141234567)" required class="w-full px-3 py-2 border border-stone-300 rounded-lg" />
          <input type="text" id="producto" placeholder="Producto (ej. Pastel de chocolate)" required class="w-full px-3 py-2 border border-stone-300 rounded-lg" />
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="cantidad" value="1" min="1" placeholder="Cantidad" required class="w-full px-3 py-2 border border-stone-300 rounded-lg" />
            <input type="number" id="total" step="0.01" placeholder="Total ($)" required class="w-full px-3 py-2 border border-stone-300 rounded-lg" />
          </div>
          <input type="date" id="fecha_entrega" required class="w-full px-3 py-2 border border-stone-300 rounded-lg" />
          <input type="text" id="notas" placeholder="Notas o dedicatoria" class="w-full px-3 py-2 border border-stone-300 rounded-lg" />
          <button type="submit" class="w-full bg-stone-900 text-white py-2 rounded-lg hover:bg-stone-800">
            Guardar pedido
          </button>
        </form>
      </section>

      <!-- Lista y Filtros -->
      <section class="md:col-span-2 bg-white p-5 rounded-xl border border-stone-200">
        <div class="flex flex-wrap gap-2 justify-between items-center mb-4">
          <h2 class="text-base font-medium">Pedidos registrados</h2>
          <div class="flex gap-2">
            <input type="text" id="buscarCliente" placeholder="Buscar cliente..." oninput="cargarPedidos()" class="px-3 py-1.5 text-sm border border-stone-300 rounded-lg" />
            <select id="filtroEstado" onchange="cargarPedidos()" class="px-3 py-1.5 text-sm border border-stone-300 rounded-lg">
              <option value="Todos">Todos</option>
              <option value="Pendiente">Pendiente</option>
              <option value="En preparación">En preparación</option>
              <option value="Listo">Listo</option>
              <option value="Entregado">Entregado</option>
            </select>
          </div>
        </div>
        <div id="listaPedidos" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
